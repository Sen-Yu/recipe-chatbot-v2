name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 의존성 설치
        run: uv sync --locked
      - name: 린트
        run: uv run ruff check .
      - name: 테스트
        run: uv run pytest -q
