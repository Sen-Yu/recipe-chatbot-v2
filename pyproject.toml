[project]
name = "recipe-chatbot-v2"
version = "0.1.0"
description = "재료 기반 레시피 추천 동적 멀티 에이전트 챗봇 v2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "langgraph>=1.0",
    "pydantic>=2.7",
]

[dependency-groups]
crawl = [
    "playwright>=1.65.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_chatbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"data_pipeline/structure_prompt.py" = ["E501"]  # v1 프롬프트 원문을 줄바꿈 없이 그대로 둔다
