# 에이전트별 (베이스 모델, 어댑터) 설정 예시.
# 실제 값은 벤치마크(로드맵 1번)로 정하고, 이 파일을 config/models.toml 로 복사해서 쓴다.
#
# 서빙: vLLM 우선, 로컬에서 안 되면 Ollama. 둘 다 OpenAI 호환 /v1/chat/completions 를 쓴다.
# 요청에 쓰는 모델 이름 = served_name > adapter > base 순서.
#   - vLLM multi-LoRA: --lora-modules 로 등록한 어댑터 이름을 그대로 씀
#   - Ollama: 어댑터마다 Modelfile 로 만든 모델 이름을 served_name 에 적음

[endpoints.big]
base_url = "http://localhost:8000/v1"     # vLLM (큰 모델)

[endpoints.small]
base_url = "http://localhost:11434/v1"    # Ollama (작은 모델)

[agents.supervisor]
endpoint = "big"
base = "BIG_BASE_MODEL"
adapter = "supervisor-lora"               # 어댑터 학습 전에는 이 줄을 지운다

[agents.recipe]
endpoint = "big"
base = "BIG_BASE_MODEL"
adapter = "recipe-lora"

[agents.ingredient]
endpoint = "small"
base = "SMALL_BASE_MODEL"

[agents.nutrition]
endpoint = "small"
base = "SMALL_BASE_MODEL"
